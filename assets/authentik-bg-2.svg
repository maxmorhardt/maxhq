<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <!-- v2: minimal aurora wash. Just soft brand-colour glows on a dark base. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#15161c" />
      <stop offset="0.55" stop-color="#191a21" />
      <stop offset="1"    stop-color="#111218" />
    </linearGradient>
    <radialGradient id="g1" cx="0.16" cy="0.12" r="0.72">
      <stop offset="0"    stop-color="#6d28d9" stop-opacity="0.34" />
      <stop offset="0.55" stop-color="#6d28d9" stop-opacity="0.05" />
      <stop offset="1"    stop-color="#6d28d9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g2" cx="0.9" cy="0.9" r="0.72">
      <stop offset="0"    stop-color="#2563eb" stop-opacity="0.28" />
      <stop offset="0.55" stop-color="#2563eb" stop-opacity="0.04" />
      <stop offset="1"    stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g3" cx="0.8" cy="0.04" r="0.45">
      <stop offset="0"    stop-color="#a855f7" stop-opacity="0.16" />
      <stop offset="0.6"  stop-color="#a855f7" stop-opacity="0.03" />
      <stop offset="1"    stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0.55" stop-color="#000" stop-opacity="0" />
      <stop offset="1"    stop-color="#000" stop-opacity="0.5" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)" />
  <rect width="1920" height="1080" fill="url(#g1)" />
  <rect width="1920" height="1080" fill="url(#g2)" />
  <rect width="1920" height="1080" fill="url(#g3)" />
  <rect width="1920" height="1080" fill="url(#vignette)" />
</svg>
