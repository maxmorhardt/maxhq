<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <!-- v4: a glowing node constellation (identity graph) on an aurora base. No geometry blocks. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#15161c" />
      <stop offset="0.55" stop-color="#191a21" />
      <stop offset="1"    stop-color="#111218" />
    </linearGradient>

    <radialGradient id="g1" cx="0.12" cy="0.14" r="0.72">
      <stop offset="0"    stop-color="#6d28d9" stop-opacity="0.30" />
      <stop offset="0.55" stop-color="#6d28d9" stop-opacity="0.05" />
      <stop offset="1"    stop-color="#6d28d9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g2" cx="0.9" cy="0.9" r="0.72">
      <stop offset="0"    stop-color="#2563eb" stop-opacity="0.26" />
      <stop offset="0.55" stop-color="#2563eb" stop-opacity="0.04" />
      <stop offset="1"    stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g3" cx="0.86" cy="0.08" r="0.45">
      <stop offset="0"    stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="0.6"  stop-color="#a855f7" stop-opacity="0.03" />
      <stop offset="1"    stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ddd6fe" stop-opacity="0.95" />
      <stop offset="0.4" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="1"   stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0.5" stop-color="#000" stop-opacity="0" />
      <stop offset="1"   stop-color="#000" stop-opacity="0.55" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)" />
  <rect width="1920" height="1080" fill="url(#g1)" />
  <rect width="1920" height="1080" fill="url(#g2)" />
  <rect width="1920" height="1080" fill="url(#g3)" />

  <!-- connecting edges, kept to the edges/corners so the centre stays clear -->
  <g stroke="#8b7cff" stroke-opacity="0.16" stroke-width="1.1">
    <line x1="160" y1="150" x2="430" y2="110" />
    <line x1="430" y1="110" x2="690" y2="210" />
    <line x1="160" y1="150" x2="120" y2="430" />
    <line x1="120" y1="430" x2="320" y2="650" />
    <line x1="320" y1="650" x2="240" y2="900" />
    <line x1="240" y1="900" x2="560" y2="980" />
    <line x1="690" y1="210" x2="430" y2="110" />
    <line x1="120" y1="430" x2="430" y2="110" />
    <line x1="1360" y1="140" x2="1700" y2="120" />
    <line x1="1700" y1="120" x2="1830" y2="430" />
    <line x1="1360" y1="140" x2="1560" y2="300" />
    <line x1="1560" y1="300" x2="1830" y2="430" />
    <line x1="1830" y1="430" x2="1660" y2="700" />
    <line x1="1660" y1="700" x2="1780" y2="900" />
    <line x1="1780" y1="900" x2="1480" y2="960" />
    <line x1="1480" y1="960" x2="1660" y2="700" />
    <line x1="1560" y1="300" x2="1660" y2="700" />
  </g>

  <!-- glowing nodes -->
  <g>
    <circle cx="160"  cy="150" r="26" fill="url(#node)" />
    <circle cx="430"  cy="110" r="20" fill="url(#node)" />
    <circle cx="690"  cy="210" r="16" fill="url(#node)" opacity="0.8" />
    <circle cx="120"  cy="430" r="22" fill="url(#node)" />
    <circle cx="320"  cy="650" r="18" fill="url(#node)" opacity="0.85" />
    <circle cx="240"  cy="900" r="16" fill="url(#node)" opacity="0.75" />
    <circle cx="560"  cy="980" r="20" fill="url(#node)" opacity="0.8" />
    <circle cx="1360" cy="140" r="20" fill="url(#node)" />
    <circle cx="1700" cy="120" r="24" fill="url(#node)" />
    <circle cx="1830" cy="430" r="22" fill="url(#node)" />
    <circle cx="1560" cy="300" r="16" fill="url(#node)" opacity="0.85" />
    <circle cx="1660" cy="700" r="22" fill="url(#node)" />
    <circle cx="1780" cy="900" r="18" fill="url(#node)" opacity="0.8" />
    <circle cx="1480" cy="960" r="20" fill="url(#node)" opacity="0.8" />
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)" />
</svg>
