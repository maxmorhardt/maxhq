name = "maxhq-maintenance"
main = "worker.js"
compatibility_date = "2026-07-01"
routes = [
  { pattern = "maxhq.io/*", zone_name = "maxhq.io" },
  { pattern = "*.maxhq.io/*", zone_name = "maxhq.io" },
]

# bundle the page's fonts as ArrayBuffers
[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true
