{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "app.fullname" . }}.rules
      interval: 30s
      rules:
        {{- range .Values.metrics.prometheusRule.rules }}
        - alert: {{ .alert }}
          expr: {{ tpl .expr $ | quote }}
          {{- if .for }}
          for: {{ .for }}
          {{- end }}
          {{- with .labels }}
          labels:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .annotations }}
          annotations:
            {{- range $key, $value := . }}
            {{ $key }}: {{ tpl $value $ | quote }}
            {{- end }}
          {{- end }}
        {{- end }}
{{- end }}
