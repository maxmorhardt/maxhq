{{- if .Values.route.enabled }}
{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "root" $ "name" $name }}
{{- $prefix := $.Values.route.prefix }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "squares.serviceName" $ctx }}
  labels:
    {{- include "squares.serviceLabels" $ctx | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Values.route.gateway.name }}
      namespace: {{ $.Values.route.gateway.namespace }}
  hostnames:
    {{- range $.Values.route.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    {{- range $svc.routes.prefixes }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ printf "%s%s" $prefix . }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ . }}
      {{- if $svc.streaming }}
      timeouts:
        request: 0s
      {{- end }}
      backendRefs:
        - name: {{ include "squares.serviceName" $ctx }}
          port: {{ $.Values.service.port }}
    {{- end }}
    {{- range $svc.routes.exact }}
    - matches:
        - path:
            type: Exact
            value: {{ printf "%s%s" $prefix . }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ . }}
      backendRefs:
        - name: {{ include "squares.serviceName" $ctx }}
          port: {{ $.Values.service.port }}
    {{- end }}
    # each service serves its own api reference at /squares/swagger/<service>
    - matches:
        - path:
            type: PathPrefix
            value: {{ printf "%s/swagger/%s" $prefix $name }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /swagger
      backendRefs:
        - name: {{ include "squares.serviceName" $ctx }}
          port: {{ $.Values.service.port }}
{{- end }}
{{- end }}
