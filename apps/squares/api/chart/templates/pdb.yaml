{{- range $name, $svc := .Values.services }}
{{- with $svc.pdb }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "squares.serviceName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "squares.serviceLabels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ .minAvailable }}
  selector:
    matchLabels:
      {{- include "squares.serviceSelectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
