fullnameOverride: squares-api

image:
  repository: maxmorhardt/squares-api
  tag: latest
  pullPolicy: Always
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  volumes:
    - name: tmp
      mountPath: /tmp
      volumeType: emptyDir
    - name: home
      mountPath: /home/squares
      volumeType: emptyDir
    - name: log
      mountPath: /var/log
      volumeType: emptyDir
  envFrom:
    - secretRef:
        name: squares-api-env
  startupProbe:
    path: /health/live
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  readinessProbe:
    path: /health/ready
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 5
    successThreshold: 1
  livenessProbe:
    path: /health/live
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 5
    successThreshold: 1

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  name: http

route:
  enabled: true
  gateway:
    name: maxstash
    namespace: envoy-gateway-system
  hostnames:
    - api.maxstash.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /squares
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
  rateLimit:
    enabled: true
    requests: 100
    unit: Second

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 1Gi

affinity:
  podAntiAffinity:
    enabled: true
    weight: 100
    topologyKey: kubernetes.io/hostname

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPU: 85
  targetRAM: 85

pdb:
  enabled: true
  minAvailable: 1

metrics:
  enabled: true
  service:
    port: 9090
    targetPort: 9090
    type: ClusterIP
    name: metrics
  path: /metrics
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    honorLabels: true
  prometheusRule:
    enabled: true
    labels: {}
    rules:
      # High Request Latency
      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="{{ include "app.fullname" . }}", path!~"/ws.*"}[5m])) by (le, method, path)) > 1
        for: 5m
        labels:
          severity: warning
          component: squares-api
          layer: api
        annotations:
          summary: 'High request latency detected'
          description: 'P99 latency is {{ $value }}s for {{ $labels.method }} {{ $labels.path }} on {{ $labels.job }}'

      - alert: CriticalRequestLatency
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="{{ include "app.fullname" . }}", path!~"/ws.*"}[5m])) by (le, method, path)) > 3
        for: 5m
        labels:
          severity: critical
          component: squares-api
          layer: api
        annotations:
          summary: 'Critical request latency detected'
          description: 'P99 latency is {{ $value }}s for {{ $labels.method }} {{ $labels.path }} on {{ $labels.job }}'

      # High Error Rate
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="{{ include "app.fullname" . }}",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          component: squares-api
          layer: api
        annotations:
          summary: 'High HTTP error rate'
          description: 'Error rate is {{ $value | humanizePercentage }} for {{ $labels.job }}'

      - alert: CriticalErrorRate
        expr: |
          sum(rate(http_requests_total{job="{{ include "app.fullname" . }}",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m])) > 0.10
        for: 2m
        labels:
          severity: critical
          component: squares-api
          layer: api
        annotations:
          summary: 'Critical HTTP error rate'
          description: 'Error rate is {{ $value | humanizePercentage }} for {{ $labels.job }}'

      # Request Rate Anomaly
      - alert: RequestRateDrop
        expr: |
          (sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m])) / sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m] offset 1h))) < 0.2
        for: 10m
        labels:
          severity: warning
          component: squares-api
          layer: api
        annotations:
          summary: 'Significant drop in request rate'
          description: 'Request rate has dropped to {{ $value | humanizePercentage }} of normal for {{ $labels.job }}'

      # High 4xx Rate
      - alert: High4xxRate
        expr: |
          sum(rate(http_requests_total{job="{{ include "app.fullname" . }}",status=~"4.."}[5m])) / sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m])) > 0.20
        for: 10m
        labels:
          severity: warning
          component: squares-api
          layer: api
        annotations:
          summary: 'High client error rate'
          description: '4xx error rate is {{ $value | humanizePercentage }} for {{ $labels.job }}'

      - alert: Critical4xxRate
        expr: |
          sum(rate(http_requests_total{job="{{ include "app.fullname" . }}",status=~"4.."}[5m])) / sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m])) > 0.50
        for: 5m
        labels:
          severity: critical
          component: squares-api
          layer: api
        annotations:
          summary: 'Critical client error rate'
          description: '4xx error rate is {{ $value | humanizePercentage }} for {{ $labels.job }}'

dashboard:
  enabled: true
  namespace: monitoring
  file: squares-api-dashboard.json
  filename: squares-api-dashboard.json
  labels:
    grafana_dashboard: '1'
  annotations: {}
