# every backend service is named <fullnameOverride>-<service>, e.g. squares-contests
fullnameOverride: squares

image:
  # each service has its own image: <repositoryPrefix><service>
  repositoryPrefix: maxmorhardt/squares-
  # empty uses the chart appVersion, which release-please keeps equal to the app version
  tag: ''
  pullPolicy: Always
  revisionHistoryLimit: 2
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  volumes:
    - name: tmp
      mountPath: /tmp
      volumeType: emptyDir
    - name: home
      mountPath: /home/squares
      volumeType: emptyDir
    - name: log
      mountPath: /var/log
      volumeType: emptyDir
  # shared by every service; see DEPENDENCIES.md for the keys
  envFrom:
    - secretRef:
        name: squares-api-env
  startupProbe:
    path: /health/live
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  readinessProbe:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  livenessProbe:
    path: /health/live
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
    successThreshold: 1

# env every service gets on top of the secret
env:
  NATS_STREAM_REPLICAS: '3'
  NATS_STREAM_MAX_AGE: 168h
  CONTESTS_INTERNAL_URL: http://squares-contests:8080

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  name: http

route:
  enabled: true
  gateway:
    name: maxstash
    namespace: envoy-gateway-system
  hostnames:
    - api.maxstash.io
  # public path prefix; the gateway strips it before forwarding
  prefix: /squares
  rateLimit:
    enabled: true
    requests: 100
    unit: Second

# the gateway validates dex id tokens and hands the claims to the services as headers
auth:
  enabled: true
  issuer: https://login.maxstash.io
  jwksURI: https://login.maxstash.io/keys
  audiences:
    - squares
    - squares-mobile
  # a missing token passes through without identity headers; each service decides which routes need one
  optional: true
  claimToHeaders:
    - header: X-Auth-Email
      claim: email
    - header: X-Auth-Name
      claim: name
    - header: X-Auth-Email-Verified
      claim: email_verified
    - header: X-Auth-Iat
      claim: iat
    - header: X-Auth-Exp
      claim: exp

# pods only accept app traffic from the gateway (and contests from its two internal callers), metrics from prometheus
networkPolicy:
  enabled: true
  gatewayNamespace: envoy-gateway-system
  monitoringNamespace: monitoring

affinity:
  podAntiAffinity:
    enabled: true
    weight: 100
    topologyKey: kubernetes.io/hostname

services:
  contests:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 500m
        memory: 512Mi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPU: 85
      targetRAM: 85
    pdb:
      minAvailable: 1
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    env: {}
    # services that may call this one directly, by service name
    internalCallers:
      - accounts
      - realtime
    routes:
      prefixes:
        - /contests
        - /invites
        - /leaderboard
        - /stats
      exact:
        - /users/me/stats
        - /users/me/active-contests

  games:
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 256Mi
    # the scores worker holds an advisory lock, so extra replicas only serve /games/upcoming
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 3
      targetCPU: 85
      targetRAM: 85
    pdb:
      minAvailable: 1
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    env:
      SCORES_ENABLED: 'true'
    internalCallers: []
    routes:
      prefixes:
        - /games
      exact: []

  accounts:
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 256Mi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPU: 85
      targetRAM: 85
    pdb:
      minAvailable: 1
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    env: {}
    internalCallers: []
    routes:
      prefixes:
        - /contact
      exact:
        - /users/me

  realtime:
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 256Mi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPU: 70
      targetRAM: 85
    pdb:
      minAvailable: 1
    # surge first so open streams have somewhere to reconnect to with their Last-Event-ID
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    env:
      SSE_HEARTBEAT_INTERVAL: 25s
      SSE_REVOCATION_INTERVAL: 5m
    internalCallers: []
    # streams stay open until the token expires, so the gateway must not time them out
    streaming: true
    routes:
      prefixes:
        - /events
      exact: []

metrics:
  enabled: true
  service:
    port: 9090
    targetPort: 9090
    type: ClusterIP
    name: metrics
  path: /metrics
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    honorLabels: true
  prometheusRule:
    enabled: true
    labels: {}
    rules:
      # High Request Latency (streams are long by design, so realtime is excluded)
      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=~"{{ include "app.fullname" . }}-(contests|games|accounts)"}[5m])) by (le, job, method, path)) > 1
        for: 5m
        labels:
          severity: warning
          component: squares-api
          layer: api
        annotations:
          summary: 'High request latency detected'
          description: 'P99 latency is {{ $value }}s for {{ $labels.method }} {{ $labels.path }} on {{ $labels.job }}'

      - alert: CriticalRequestLatency
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=~"{{ include "app.fullname" . }}-(contests|games|accounts)"}[5m])) by (le, job, method, path)) > 3
        for: 5m
        labels:
          severity: critical
          component: squares-api
          layer: api
        annotations:
          summary: 'Critical request latency detected'
          description: 'P99 latency is {{ $value }}s for {{ $labels.method }} {{ $labels.path }} on {{ $labels.job }}'

      # High Error Rate
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job=~"{{ include "app.fullname" . }}-.*",status=~"5.."}[5m])) by (job) / sum(rate(http_requests_total{job=~"{{ include "app.fullname" . }}-.*"}[5m])) by (job) > 0.05
        for: 5m
        labels:
          severity: warning
          component: squares-api
          layer: api
        annotations:
          summary: 'High HTTP error rate'
          description: 'Error rate is {{ $value | humanizePercentage }} for {{ $labels.job }}'

      - alert: CriticalErrorRate
        expr: |
          sum(rate(http_requests_total{job=~"{{ include "app.fullname" . }}-.*",status=~"5.."}[5m])) by (job) / sum(rate(http_requests_total{job=~"{{ include "app.fullname" . }}-.*"}[5m])) by (job) > 0.10
        for: 2m
        labels:
          severity: critical
          component: squares-api
          layer: api
        annotations:
          summary: 'Critical HTTP error rate'
          description: 'Error rate is {{ $value | humanizePercentage }} for {{ $labels.job }}'

      # Request Rate Anomaly
      - alert: RequestRateDrop
        expr: |
          (sum(rate(http_requests_total{job="{{ include "app.fullname" . }}-contests"}[5m])) / sum(rate(http_requests_total{job="{{ include "app.fullname" . }}-contests"}[5m] offset 1h))) < 0.2
        for: 10m
        labels:
          severity: warning
          component: squares-api
          layer: api
        annotations:
          summary: 'Significant drop in request rate'
          description: 'Contests request rate has dropped to {{ $value | humanizePercentage }} of normal'

      # High 4xx Rate
      - alert: High4xxRate
        expr: |
          sum(rate(http_requests_total{job=~"{{ include "app.fullname" . }}-.*",status=~"4.."}[5m])) by (job) / sum(rate(http_requests_total{job=~"{{ include "app.fullname" . }}-.*"}[5m])) by (job) > 0.20
        for: 10m
        labels:
          severity: warning
          component: squares-api
          layer: api
        annotations:
          summary: 'High client error rate'
          description: '4xx error rate is {{ $value | humanizePercentage }} for {{ $labels.job }}'

      - alert: Critical4xxRate
        expr: |
          sum(rate(http_requests_total{job=~"{{ include "app.fullname" . }}-.*",status=~"4.."}[5m])) by (job) / sum(rate(http_requests_total{job=~"{{ include "app.fullname" . }}-.*"}[5m])) by (job) > 0.50
        for: 5m
        labels:
          severity: critical
          component: squares-api
          layer: api
        annotations:
          summary: 'Critical client error rate'
          description: '4xx error rate is {{ $value | humanizePercentage }} for {{ $labels.job }}'

      # Scores Worker
      - alert: ScoresWorkerFailing
        expr: |
          increase(scores_worker_runs_total{job="{{ include "app.fullname" . }}-games",result="error"}[1h]) >= 3
        for: 5m
        labels:
          severity: warning
          component: squares-api
          layer: api
        annotations:
          summary: 'Scores worker runs are failing'
          description: '{{ $value }} scores worker runs failed in the last hour on {{ $labels.job }}; the ESPN scoreboard response may have changed'

      # threshold clears the 6h idle poll interval; the > 0 guard keeps a never-yet-run worker quiet
      - alert: ScoresWorkerStale
        expr: |
          (time() - max(scores_worker_last_success_timestamp_seconds{job="{{ include "app.fullname" . }}-games"}) > 25200) and (max(scores_worker_last_success_timestamp_seconds{job="{{ include "app.fullname" . }}-games"}) > 0)
        for: 30m
        labels:
          severity: critical
          component: squares-api
          layer: api
        annotations:
          summary: 'Scores worker has not succeeded recently'
          description: 'Last successful scores worker run was {{ $value }}s ago; live contests are not being scored'

      # Events
      - alert: OutboxBacklog
        expr: |
          max(outbox_oldest_pending_seconds{job=~"{{ include "app.fullname" . }}-.*"}) by (job) > 60
        for: 5m
        labels:
          severity: warning
          component: squares-api
          layer: api
        annotations:
          summary: 'Events are not reaching JetStream'
          description: 'The oldest unrelayed outbox event on {{ $labels.job }} is {{ $value }}s old; other services and live viewers are not seeing its changes'

      - alert: ConsumerFailing
        expr: |
          sum(increase(jetstream_consumer_messages_total{job="{{ include "app.fullname" . }}-contests",result="error"}[15m])) by (consumer) > 10
        for: 10m
        labels:
          severity: warning
          component: squares-api
          layer: api
        annotations:
          summary: 'Contests keeps failing to apply events'
          description: 'Consumer {{ $labels.consumer }} failed {{ $value }} times in 15m; game or profile updates are stuck behind a message it cannot apply'

      - alert: RealtimeStreamsFailing
        expr: |
          sum(rate(sse_streams_total{job="{{ include "app.fullname" . }}-realtime",result=~"unavailable|internal_error"}[5m])) / sum(rate(sse_streams_total{job="{{ include "app.fullname" . }}-realtime"}[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
          component: squares-api
          layer: api
        annotations:
          summary: 'Live contest streams are failing to open'
          description: '{{ $value | humanizePercentage }} of stream opens fail; check JetStream and the contests internal API'

dashboard:
  enabled: true
  namespace: monitoring
  file: squares-api-dashboard.json
  filename: squares-api-dashboard.json
  labels:
    grafana_dashboard: '1'
  annotations: {}
