      ContestRepository:
      ParticipantRepository:
      InviteRepository:
      StatsRepository:
      LeaderboardRepository:
      UserProjectionRepository:
      GameProjectionRepository:
  github.com/maxmorhardt/maxstash/apps/squares/api/internal/contests/service:
    interfaces:
      ContestService:
      ContestEventPublisher:
      ParticipantService:
      InviteService:
      StatsService:
      LeaderboardService:
