  github.com/maxmorhardt/maxstash/apps/squares/api/internal/accounts/repository:
    interfaces:
      UserRepository:
      ContactRepository:
  github.com/maxmorhardt/maxstash/apps/squares/api/internal/accounts/service:
    interfaces:
      UserService:
      ContactService:
  # realtime
  github.com/maxmorhardt/maxstash/apps/squares/api/internal/realtime/clients:
