profile: coverage.out
threshold:
  file: 0
  package: 0
  total: 80

exclude:
  paths:
    - cmd
    - docs
    - internal/errs
    - internal/metrics
    - internal/mocks
    - internal/model
    - internal/.*/routes
    - internal/.*/migrations
    - internal/accounts/templates
    # test-only helper that runs an in-process nats server
    - internal/platform/messaging/natstest
