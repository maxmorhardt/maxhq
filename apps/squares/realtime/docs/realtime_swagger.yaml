definitions:
  api.APIError:
    properties:
      code:
        example: 400
        type: integer
      message:
        example: invalid request
        type: string
      requestId:
        example: 7db692fa-c767-468f-af3d-9231b0f88c69
        type: string
      timestamp:
        example: "2025-10-05T13:45:00Z"
        type: string
    type: object
  api.LivenessResponse:
    properties:
      status:
        type: string
    type: object
  api.ReadinessResponse:
    properties:
      checks:
        additionalProperties:
          type: string
        type: object
      status:
        type: string
    type: object
info:
  contact: {}
  description: Server-sent contest events for squares.maxhq.io, resumable with Last-Event-ID.
    Served under /squares behind the gateway, which validates the bearer token.
  title: Squares Realtime API
  version: 1.0.0
paths:
  /events/contests/{id}:
    get:
      description: Server-sent events for one contest. The first event is a `contest.snapshot`
        of the contest and its participants, unless the client resumes with Last-Event-ID
        and the gap is still retained, in which case only the missed events are replayed.
        Every event carries its stream entry id (`<ms>-<seq>`) as the SSE id. An `access.revoked`
        event means the viewer lost access and the stream is closing.
      parameters:
      - description: Contest ID
        in: path
        name: id
        required: true
        type: string
      - description: Id of the last event the client applied
        in: header
        name: Last-Event-ID
        type: string
      - description: Same as the Last-Event-ID header, for clients that cannot set
          headers
        in: query
        name: lastEventId
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: text/event-stream; each data line is a JSON contest event
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.APIError'
      security:
      - BearerAuth: []
      summary: Stream contest events
      tags:
      - events
  /events/games:
    get:
      description: 'Server-sent `game.updated` events for every NFL game as its status,
        period, or score changes. Each data line is `{"game": {...}}` in the shape
        `/games/scoreboard` returns. Public; resumable with Last-Event-ID.'
      parameters:
      - description: Id of the last event the client applied
        in: header
        name: Last-Event-ID
        type: string
      - description: Same as the Last-Event-ID header, for clients that cannot set
          headers
        in: query
        name: lastEventId
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: text/event-stream; each data line is a JSON game update
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Stream game scores
      tags:
      - events
  /health/live:
    get:
      description: Returns UP if the service process is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.LivenessResponse'
      summary: Liveness check
      tags:
      - health
  /health/ready:
    get:
      description: Checks every dependency the service needs to serve traffic
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ReadinessResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.ReadinessResponse'
      summary: Readiness check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
