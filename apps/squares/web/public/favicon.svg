<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Squares">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ba3ff" />
      <stop offset="1" stop-color="#3b78ff" />
    </linearGradient>
  </defs>
  <!-- inset so the diagonal corners stay inside Google's circle crop -->
  <g stroke="url(#g)" stroke-width="3.6">
    <rect x="15.6" y="8" width="24.4" height="24.4" rx="4.6" />
    <rect x="8" y="15.6" width="24.4" height="24.4" rx="4.6" />
  </g>
</svg>
