# one image serves dev and prod; react router hydration and mui need 'unsafe-inline'
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.maxhq.io https://api.dev.maxhq.io https://login.maxhq.io https://login.dev.maxhq.io https://faro-collector-prod-us-east-2.grafana.net; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
