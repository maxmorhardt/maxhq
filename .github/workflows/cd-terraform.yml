name: Terraform CD

on:
  push:
    branches:
      - main
    paths:
      - 'infra/terraform/**'
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  apply:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        module: [aws, cloudflare, github]
    uses: maxmorhardt/workflows/.github/workflows/cd-terraform.yml@4d64c3534f2e10f2fe0d602f6e01b6db0d384ef7 # v1.0.1
    with:
      repository: ${{ github.repository }}
      working_directory: infra/terraform/${{ matrix.module }}
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      cloudflare_api_token: ${{ matrix.module == 'cloudflare' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      repo_admin_token: ${{ matrix.module == 'github' && secrets.REPO_ADMIN_TOKEN || '' }}
      tf_vars: ${{ matrix.module == 'cloudflare' && secrets.TF_VARS || '' }}

  drift:
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        module: [aws, cloudflare, github]
    uses: maxmorhardt/workflows/.github/workflows/validate-terraform.yml@4d64c3534f2e10f2fe0d602f6e01b6db0d384ef7 # v1.0.1
    with:
      repository: ${{ github.repository }}
      working_directory: infra/terraform/${{ matrix.module }}
      fail_on_diff: true
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      cloudflare_api_token: ${{ matrix.module == 'cloudflare' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      repo_admin_token: ${{ matrix.module == 'github' && secrets.REPO_ADMIN_TOKEN || '' }}
      tf_vars: ${{ matrix.module == 'cloudflare' && secrets.TF_VARS || '' }}
