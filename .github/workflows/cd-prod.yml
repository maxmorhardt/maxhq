name: Prod CD

on:
  push:
    tags:
      - 'maxhq/*'
      - 'squares/*'
      - 'squares-contests/*'
      - 'squares-games/*'
      - 'squares-accounts/*'
      - 'squares-realtime/*'
      - '*-chart/*'

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parse:
    name: Parse tag
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.parse.outputs.kind }}
      app: ${{ steps.parse.outputs.app }}
      version: ${{ steps.parse.outputs.version }}
      dev_tag: ${{ steps.source.outputs.dev_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Split tag into app and version
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          component="${TAG%%/*}"
          kind=image
          if [ "${component%-chart}" != "$component" ]; then
            kind=chart
          fi
          {
            echo "kind=$kind"
            echo "app=${component%-chart}"
            echo "version=${TAG#*/}"
          } >> "$GITHUB_OUTPUT"

      # the release commit only changes changelogs, so promote the image dev built for the last real change
      - name: Find the dev image to promote
        id: source
        if: steps.parse.outputs.kind == 'image'
        env:
          APP: ${{ steps.parse.outputs.app }}
        run: |
          case "$APP" in
            maxhq) filters=(maxhq) ;;
            squares) filters=(squares_web) ;;
            squares-*) filters=("${APP#squares-}" go_libs squares_build) ;;
            *) echo "::error::no dev path filters for $APP"; exit 1 ;;
          esac
          mapfile -t paths < <(for f in "${filters[@]}"; do yq ".${f}[]" .github/path-filters.yml; done | sed 's/^/:(glob)/')
          commit=$(git log -1 --format=%H "$GITHUB_SHA^" -- "${paths[@]}" ':(glob,exclude)**/CHANGELOG.md')
          if [ -z "$commit" ]; then
            echo "::error::no commit before $GITHUB_SHA changed $APP"
            exit 1
          fi
          echo "dev_tag=sha-${commit::7}" >> "$GITHUB_OUTPUT"

  # app releases

  promote:
    needs: parse
    if: needs.parse.outputs.kind == 'image'
    uses: maxmorhardt/workflows/.github/workflows/cd-promote.yml@main
    with:
      app_name: ${{ needs.parse.outputs.app }}
      source_tag: ${{ needs.parse.outputs.dev_tag }}
      target_tag: ${{ needs.parse.outputs.version }}
    secrets: inherit

  image-deploy:
    needs: [parse, promote]
    uses: maxmorhardt/workflows/.github/workflows/cd-argocd.yml@main
    with:
      environment: prod
      app: ${{ needs.parse.outputs.app }}
      image_tag: ${{ needs.parse.outputs.version }}
    secrets: inherit

  # chart releases

  chart-publish:
    needs: parse
    if: needs.parse.outputs.kind == 'chart'
    uses: maxmorhardt/workflows/.github/workflows/ci-helm.yml@main
    with:
      repository: ${{ github.repository }}
      chart: charts/${{ needs.parse.outputs.app }}
      version: ${{ needs.parse.outputs.version }}

  chart-deploy:
    needs: [parse, chart-publish]
    uses: maxmorhardt/workflows/.github/workflows/cd-argocd.yml@main
    with:
      environment: prod
      app: ${{ needs.parse.outputs.app }}
      chart_version: ${{ needs.parse.outputs.version }}
    secrets: inherit
