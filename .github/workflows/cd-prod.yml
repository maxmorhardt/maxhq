name: Prod CD

on:
  push:
    tags:
      - 'maxhq/*'
      - 'squares/*'
      - 'squares-contests/*'
      - 'squares-games/*'
      - 'squares-accounts/*'
      - 'squares-realtime/*'
      - '*-chart/*'

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parse:
    name: Parse tag
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.parse.outputs.kind }}
      app: ${{ steps.parse.outputs.app }}
      version: ${{ steps.parse.outputs.version }}
      dev_tag: ${{ steps.parse.outputs.dev_tag }}
      smoke_url: ${{ steps.parse.outputs.smoke_url }}
    steps:
      - name: Split tag into app and version
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          component="${TAG%%/*}"
          kind=image
          if [ "${component%-chart}" != "$component" ]; then
            kind=chart
          fi
          app="${component%-chart}"
          case "$app" in
            maxhq|gateway) smoke_url=https://maxhq.io ;;
            squares) smoke_url=https://squares.maxhq.io ;;
            squares-*) smoke_url=https://api.maxhq.io/squares/stats ;;
            *) smoke_url= ;;
          esac
          {
            echo "kind=$kind"
            echo "app=$app"
            echo "version=${TAG#*/}"
            echo "dev_tag=sha-${GITHUB_SHA::7}"
            echo "smoke_url=$smoke_url"
          } >> "$GITHUB_OUTPUT"

  # app releases

  promote:
    needs: parse
    if: needs.parse.outputs.kind == 'image'
    uses: maxmorhardt/workflows/.github/workflows/cd-promote.yml@main
    with:
      app_name: ${{ needs.parse.outputs.app }}
      source_tag: ${{ needs.parse.outputs.dev_tag }}
      target_tag: ${{ needs.parse.outputs.version }}
    secrets: inherit

  image-deploy:
    needs: [parse, promote]
    uses: maxmorhardt/workflows/.github/workflows/cd-argocd.yml@main
    with:
      environment: prod
      app: ${{ needs.parse.outputs.app }}
      image_tag: ${{ needs.parse.outputs.version }}
    secrets: inherit

  # chart releases

  chart-publish:
    needs: parse
    if: needs.parse.outputs.kind == 'chart'
    uses: maxmorhardt/workflows/.github/workflows/ci-helm.yml@main
    with:
      repository: ${{ github.repository }}
      chart: charts/${{ needs.parse.outputs.app }}
      version: ${{ needs.parse.outputs.version }}

  chart-deploy:
    needs: [parse, chart-publish]
    # cloudflare-cidr runs in dev only
    if: needs.parse.outputs.app != 'cloudflare-cidr'
    uses: maxmorhardt/workflows/.github/workflows/cd-argocd.yml@main
    with:
      environment: prod
      app: ${{ needs.parse.outputs.app }}
      chart_version: ${{ needs.parse.outputs.version }}
    secrets: inherit

  # after either deploy, confirm argo cd rolled it out and the site still answers
  verify:
    needs: [parse, image-deploy, chart-deploy]
    if: always() && (needs.image-deploy.result == 'success' || needs.chart-deploy.result == 'success')
    uses: maxmorhardt/workflows/.github/workflows/cd-verify.yml@main
    with:
      app: ${{ needs.parse.outputs.app }}
      url: ${{ needs.parse.outputs.smoke_url }}
    secrets:
      argocd_auth_token: ${{ secrets.ARGOCD_AUTH_TOKEN }}
