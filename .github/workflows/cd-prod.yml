name: Prod CD

on:
  push:
    tags:
      - 'maxhq/*'
      - 'squares/*'
      - 'squares-contests/*'
      - 'squares-games/*'
      - 'squares-accounts/*'
      - 'squares-realtime/*'
      - '*-chart/*'

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parse:
    name: Parse tag
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.parse.outputs.kind }}
      app: ${{ steps.parse.outputs.app }}
      version: ${{ steps.parse.outputs.version }}
      filters: ${{ steps.parse.outputs.filters }}
    steps:
      - name: Split tag into app and version
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          component="${TAG%%/*}"
          kind=image
          if [ "${component%-chart}" != "$component" ]; then
            kind=chart
          fi
          app="${component%-chart}"
          # the dev path filters (.github/path-filters.yml) that build each app's image
          case "$app" in
            maxhq) filters=maxhq ;;
            squares) filters=squares_web ;;
            squares-*) filters="${app#squares-} go_libs squares_build" ;;
          esac
          {
            echo "kind=$kind"
            echo "app=$app"
            echo "version=${TAG#*/}"
            echo "filters=${filters:-}"
          } >> "$GITHUB_OUTPUT"

  # app releases

  promote:
    needs: parse
    if: needs.parse.outputs.kind == 'image'
    uses: maxmorhardt/workflows/.github/workflows/cd-promote.yml@main
    with:
      app_name: ${{ needs.parse.outputs.app }}
      path_filters: ${{ needs.parse.outputs.filters }}
      target_tag: ${{ needs.parse.outputs.version }}
    secrets: inherit

  image-deploy:
    needs: [parse, promote]
    uses: maxmorhardt/workflows/.github/workflows/cd-argocd.yml@main
    with:
      environment: prod
      app: ${{ needs.parse.outputs.app }}
      image_tag: ${{ needs.parse.outputs.version }}
    secrets: inherit

  # chart releases

  chart-publish:
    needs: parse
    if: needs.parse.outputs.kind == 'chart'
    uses: maxmorhardt/workflows/.github/workflows/ci-helm.yml@main
    with:
      repository: ${{ github.repository }}
      chart: charts/${{ needs.parse.outputs.app }}
      version: ${{ needs.parse.outputs.version }}

  chart-deploy:
    needs: [parse, chart-publish]
    uses: maxmorhardt/workflows/.github/workflows/cd-argocd.yml@main
    with:
      environment: prod
      app: ${{ needs.parse.outputs.app }}
      chart_version: ${{ needs.parse.outputs.version }}
    secrets: inherit
