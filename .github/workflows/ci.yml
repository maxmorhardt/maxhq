name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      maxhq: ${{ steps.filter.outputs.maxhq == 'true' || steps.filter.outputs.workflows == 'true' }}
      squares_web: ${{ steps.filter.outputs.squares_web == 'true' || steps.filter.outputs.workflows == 'true' }}
      squares_services: ${{ steps.services.outputs.list }}
      go_libs: ${{ steps.filter.outputs.go_libs == 'true' || steps.filter.outputs.workflows == 'true' }}
      charts: ${{ steps.charts.outputs.list }}
      terraform: ${{ steps.filter.outputs.terraform == 'true' || steps.filter.outputs.workflows == 'true' }}
      k3s: ${{ steps.filter.outputs.k3s == 'true' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: .github/path-filters.yml
          list-files: json

      - name: List charts to validate
        id: charts
        env:
          FILES: ${{ steps.filter.outputs.charts_files }}
          ALL: ${{ steps.filter.outputs.workflows == 'true' }}
        run: |
          if [ "$ALL" = "true" ]; then
            names=$(find charts -mindepth 1 -maxdepth 1 -type d -printf '%f\n')
          else
            names=$(echo "${FILES:-[]}" | jq -r '.[] | split("/")[1]' | sort -u)
          fi
          # a deleted chart still lists its files
          list=$(for name in $names; do [ -d "charts/$name" ] && echo "$name"; done | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "list=${list}" >> "$GITHUB_OUTPUT"

      - name: List squares services to test
        id: services
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          ALL: ${{ steps.filter.outputs.go_libs == 'true' || steps.filter.outputs.squares_build == 'true' || steps.filter.outputs.workflows == 'true' }}
        run: |
          all='["contests","games","accounts","realtime"]'
          if [ "$ALL" = "true" ]; then
            echo "list=$all" >> "$GITHUB_OUTPUT"
          else
            echo "list=$(echo "${CHANGED:-[]}" | jq -c --argjson all "$all" 'map(select(IN($all[])))')" >> "$GITHUB_OUTPUT"
          fi

  # maxhq

  maxhq-node:
    needs: changes
    if: needs.changes.outputs.maxhq == 'true'
    uses: maxmorhardt/workflows/.github/workflows/ci-node.yml@main
    with:
      repository: ${{ github.repository }}
      app_name: maxhq
      working_directory: apps/maxhq

  maxhq-docker:
    needs: maxhq-node
    uses: maxmorhardt/workflows/.github/workflows/ci-docker.yml@main
    with:
      repository: ${{ github.repository }}
      app_name: maxhq
      context: apps/maxhq
      artifact_name: dist-maxhq
      artifact_path: apps/maxhq/dist
    secrets: inherit

  # squares web

  squares-web-node:
    needs: changes
    if: needs.changes.outputs.squares_web == 'true'
    uses: maxmorhardt/workflows/.github/workflows/ci-node.yml@main
    with:
      repository: ${{ github.repository }}
      app_name: squares
      working_directory: apps/squares/web

  squares-web-docker:
    needs: squares-web-node
    uses: maxmorhardt/workflows/.github/workflows/ci-docker.yml@main
    with:
      repository: ${{ github.repository }}
      app_name: squares
      context: apps/squares/web
      artifact_name: dist-squares
      artifact_path: apps/squares/web/dist
    secrets: inherit

  # squares services

  squares-go:
    needs: changes
    if: needs.changes.outputs.squares_services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.squares_services) }}
    uses: maxmorhardt/workflows/.github/workflows/ci-go.yml@main
    with:
      repository: ${{ github.repository }}
      working_directory: apps/squares/${{ matrix.service }}
      module_directory: .

  squares-docker:
    needs: [changes, squares-go]
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.squares_services) }}
    uses: maxmorhardt/workflows/.github/workflows/ci-docker.yml@main
    with:
      repository: ${{ github.repository }}
      app_name: squares-${{ matrix.service }}
      context: .
      dockerfile: apps/squares/Dockerfile
      build_args: SERVICE=${{ matrix.service }}
    secrets: inherit

  go-libs:
    needs: changes
    if: needs.changes.outputs.go_libs == 'true'
    strategy:
      fail-fast: false
      matrix:
        lib: [platform, squares]
    uses: maxmorhardt/workflows/.github/workflows/ci-go.yml@main
    with:
      repository: ${{ github.repository }}
      working_directory: libs/go/${{ matrix.lib }}
      module_directory: .

  # charts

  charts:
    needs: changes
    if: needs.changes.outputs.charts != '[]'
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.changes.outputs.charts) }}
    uses: maxmorhardt/workflows/.github/workflows/validate-helm.yml@main
    with:
      repository: ${{ github.repository }}
      chart: charts/${{ matrix.chart }}
      lint: true
      set_values: image.tag=0.0.0-validate

  # infra

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    strategy:
      fail-fast: false
      matrix:
        module: [aws, cloudflare, github]
    uses: maxmorhardt/workflows/.github/workflows/validate-terraform.yml@main
    with:
      repository: ${{ github.repository }}
      working_directory: infra/terraform/${{ matrix.module }}
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      cloudflare_api_token: ${{ matrix.module == 'cloudflare' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      repo_admin_token: ${{ matrix.module == 'github' && secrets.REPO_ADMIN_TOKEN || '' }}
      tf_vars: ${{ matrix.module == 'cloudflare' && secrets.TF_VARS || '' }}

  k3s-bootstrap:
    needs: changes
    if: needs.changes.outputs.k3s == 'true'
    uses: maxmorhardt/workflows/.github/workflows/ci-python.yml@feat/ci-python
    with:
      repository: ${{ github.repository }}
      app_name: k3s-bootstrap
      working_directory: infra/k3s/bootstrap

  ci-complete:
    name: CI Complete
    if: always()
    needs:
      - maxhq-node
      - maxhq-docker
      - squares-web-node
      - squares-web-docker
      - squares-go
      - squares-docker
      - go-libs
      - charts
      - terraform
      - k3s-bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "one or more CI jobs failed"
              exit 1
            fi
          done
