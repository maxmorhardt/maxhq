name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      maxstash: ${{ steps.filter.outputs.maxstash == 'true' || steps.filter.outputs.workflows == 'true' }}
      squares_web: ${{ steps.filter.outputs.squares_web == 'true' || steps.filter.outputs.workflows == 'true' }}
      charts: ${{ steps.filter.outputs.charts == 'true' || steps.filter.outputs.workflows == 'true' }}
      # the squares go services whose code or shared libraries changed, as a json list for the matrix jobs
      squares_services: ${{ steps.services.outputs.list }}
      go_libs: ${{ steps.filter.outputs.go_libs == 'true' || steps.filter.outputs.workflows == 'true' }}
      squares_e2e: ${{ steps.filter.outputs.squares_e2e == 'true' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            maxstash:
              - 'apps/maxstash/**'
            squares_web:
              - 'apps/squares/web/**'
            go_libs:
              - 'libs/go/**'
            squares_e2e:
              - 'apps/squares/contests/**'
              - 'apps/squares/games/**'
              - 'apps/squares/accounts/**'
              - 'apps/squares/realtime/**'
              - 'apps/squares/e2e/**'
              - 'libs/go/**'
            charts:
              - 'charts/**'
            workflows:
              - '.github/workflows/**'

      - name: Filter squares services
        id: go
        uses: dorny/paths-filter@v3
        with:
          filters: |
            contests:
              - 'apps/squares/contests/**'
            games:
              - 'apps/squares/games/**'
            accounts:
              - 'apps/squares/accounts/**'
            realtime:
              - 'apps/squares/realtime/**'

      # a library change can break any service, so it tests all of them
      - name: List squares services to test
        id: services
        env:
          CHANGED: ${{ steps.go.outputs.changes }}
          ALL: ${{ steps.filter.outputs.go_libs == 'true' || steps.filter.outputs.workflows == 'true' }}
        run: |
          if [ "$ALL" = "true" ]; then
            echo 'list=["contests","games","accounts","realtime"]' >> "$GITHUB_OUTPUT"
          else
            echo "list=${CHANGED:-[]}" >> "$GITHUB_OUTPUT"
          fi

  # maxstash

  maxstash-node:
    needs: changes
    if: needs.changes.outputs.maxstash == 'true'
    uses: maxmorhardt/workflows/.github/workflows/ci-node.yml@main
    with:
      repository: ${{ github.repository }}
      app_name: maxstash
      working_directory: apps/maxstash
      artifact_suffix: -maxstash

  maxstash-chart:
    needs: changes
    if: needs.changes.outputs.maxstash == 'true'
    uses: maxmorhardt/workflows/.github/workflows/ci-helm.yml@main
    with:
      repository: ${{ github.repository }}
      chart_directory: chart
      chart_name: maxstash
      working_directory: apps/maxstash

  maxstash-docker:
    needs: maxstash-node
    uses: maxmorhardt/workflows/.github/workflows/ci-docker.yml@main
    with:
      repository: ${{ github.repository }}
      app_name: maxstash
      context: apps/maxstash
      artifact_name: dist-maxstash
      artifact_path: apps/maxstash/dist
    secrets: inherit

  # squares web

  squares-web-node:
    needs: changes
    if: needs.changes.outputs.squares_web == 'true'
    uses: maxmorhardt/workflows/.github/workflows/ci-node.yml@main
    with:
      repository: ${{ github.repository }}
      app_name: squares
      working_directory: apps/squares/web
      artifact_suffix: -squares

  squares-web-chart:
    needs: changes
    if: needs.changes.outputs.squares_web == 'true'
    uses: maxmorhardt/workflows/.github/workflows/ci-helm.yml@main
    with:
      repository: ${{ github.repository }}
      chart_directory: chart
      chart_name: squares
      working_directory: apps/squares/web

  squares-web-docker:
    needs: squares-web-node
    uses: maxmorhardt/workflows/.github/workflows/ci-docker.yml@main
    with:
      repository: ${{ github.repository }}
      app_name: squares
      context: apps/squares/web
      artifact_name: dist-squares
      artifact_path: apps/squares/web/dist
    secrets: inherit

  # squares services: each is its own module, image, and chart

  squares-go:
    needs: changes
    if: needs.changes.outputs.squares_services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.squares_services) }}
    uses: maxmorhardt/workflows/.github/workflows/ci-go.yml@main
    with:
      repository: ${{ github.repository }}
      working_directory: apps/squares/${{ matrix.service }}
      swagger: true
      build: false

  squares-chart:
    needs: changes
    if: needs.changes.outputs.squares_services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.squares_services) }}
    uses: maxmorhardt/workflows/.github/workflows/ci-helm.yml@main
    with:
      repository: ${{ github.repository }}
      chart_directory: chart
      chart_name: squares-${{ matrix.service }}
      working_directory: apps/squares/${{ matrix.service }}

  # built from the repository root so the shared libraries are in the context
  squares-docker:
    needs: [changes, squares-go]
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.squares_services) }}
    uses: maxmorhardt/workflows/.github/workflows/ci-docker.yml@main
    with:
      repository: ${{ github.repository }}
      app_name: squares-${{ matrix.service }}
      context: .
      dockerfile: apps/squares/${{ matrix.service }}/Dockerfile
    secrets: inherit

  squares-e2e:
    name: Squares e2e
    needs: changes
    if: needs.changes.outputs.squares_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/squares/e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: |
            apps/squares/*/go.sum
            libs/go/*/go.sum

      - name: Run the four services together
        run: make test

  # shared go libraries

  go-libs:
    needs: changes
    if: needs.changes.outputs.go_libs == 'true'
    strategy:
      fail-fast: false
      matrix:
        lib: [platform, squares]
    uses: maxmorhardt/workflows/.github/workflows/ci-go.yml@main
    with:
      repository: ${{ github.repository }}
      working_directory: libs/go/${{ matrix.lib }}
      build: false

  # infra charts

  charts:
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    strategy:
      matrix:
        chart: [maxstash-gateway, cloudflare-ddns, cloudflare-cidr]
    uses: maxmorhardt/workflows/.github/workflows/ci-helm.yml@main
    with:
      repository: ${{ github.repository }}
      chart_directory: ${{ matrix.chart }}
      chart_name: ${{ matrix.chart }}
      working_directory: charts

  # single required check; skipped jobs count as passing because their paths did not change
  ci-complete:
    name: CI Complete
    if: always()
    needs:
      - maxstash-node
      - maxstash-chart
      - maxstash-docker
      - squares-web-node
      - squares-web-chart
      - squares-web-docker
      - squares-go
      - squares-chart
      - squares-docker
      - squares-e2e
      - go-libs
      - charts
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "one or more CI jobs failed"
              exit 1
            fi
          done
