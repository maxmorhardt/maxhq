name: Release

on:
  push:
    tags:
      - 'maxhq/*'
      - 'squares/*'
      - 'squares-contests/*'
      - 'squares-games/*'
      - 'squares-accounts/*'
      - 'squares-realtime/*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parse:
    name: Parse tag
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
      service: ${{ steps.parse.outputs.service }}
    steps:
      - name: Split tag into component and version
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          COMPONENT="${TAG%%/*}"
          VERSION="${TAG#*/}"
          echo "component=${COMPONENT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          case "$COMPONENT" in
            squares-contests|squares-games|squares-accounts|squares-realtime)
              echo "service=${COMPONENT#squares-}" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Component: ${COMPONENT}, Version: ${VERSION}"

  # maxhq

  maxhq-node:
    needs: parse
    if: needs.parse.outputs.component == 'maxhq'
    uses: maxmorhardt/workflows/.github/workflows/ci-node.yml@main
    with:
      repository: ${{ github.repository }}
      app_name: maxhq
      working_directory: apps/maxhq
      artifact_suffix: -maxhq

  maxhq-docker:
    needs: [parse, maxhq-node]
    uses: maxmorhardt/workflows/.github/workflows/ci-docker.yml@main
    with:
      repository: ${{ github.repository }}
      app_name: maxhq
      app_version: ${{ needs.parse.outputs.version }}
      context: apps/maxhq
      artifact_name: dist-maxhq
      artifact_path: apps/maxhq/dist
      push: true
    secrets: inherit

  maxhq-deploy:
    needs: [parse, maxhq-docker]
    uses: maxmorhardt/workflows/.github/workflows/cd-argocd.yml@main
    with:
      gitops_repository: maxmorhardt/gitops
      gitops_path: clusters/prod/apps
      app: maxhq
      image_tag: ${{ needs.parse.outputs.version }}
    secrets: inherit

  # squares web

  squares-web-node:
    needs: parse
    if: needs.parse.outputs.component == 'squares'
    uses: maxmorhardt/workflows/.github/workflows/ci-node.yml@main
    with:
      repository: ${{ github.repository }}
      app_name: squares
      working_directory: apps/squares/web
      artifact_suffix: -squares

  squares-web-docker:
    needs: [parse, squares-web-node]
    uses: maxmorhardt/workflows/.github/workflows/ci-docker.yml@main
    with:
      repository: ${{ github.repository }}
      app_name: squares
      app_version: ${{ needs.parse.outputs.version }}
      context: apps/squares/web
      artifact_name: dist-squares
      artifact_path: apps/squares/web/dist
      push: true
    secrets: inherit

  squares-web-deploy:
    needs: [parse, squares-web-docker]
    uses: maxmorhardt/workflows/.github/workflows/cd-argocd.yml@main
    with:
      gitops_repository: maxmorhardt/gitops
      gitops_path: clusters/prod/apps
      app: squares
      image_tag: ${{ needs.parse.outputs.version }}
    secrets: inherit

  # squares services

  squares-service-go:
    needs: parse
    if: needs.parse.outputs.service != ''
    uses: maxmorhardt/workflows/.github/workflows/ci-go.yml@main
    with:
      repository: ${{ github.repository }}
      working_directory: apps/squares/${{ needs.parse.outputs.service }}
      swagger: true
      build: false

  squares-service-docker:
    needs: [parse, squares-service-go]
    uses: maxmorhardt/workflows/.github/workflows/ci-docker.yml@main
    with:
      repository: ${{ github.repository }}
      app_name: ${{ needs.parse.outputs.component }}
      app_version: ${{ needs.parse.outputs.version }}
      context: .
      dockerfile: apps/squares/Dockerfile
      build_args: SERVICE=${{ needs.parse.outputs.service }}
      push: true
    secrets: inherit

  squares-service-deploy:
    needs: [parse, squares-service-docker]
    uses: maxmorhardt/workflows/.github/workflows/cd-argocd.yml@main
    with:
      gitops_repository: maxmorhardt/gitops
      gitops_path: clusters/prod/apps
      app: ${{ needs.parse.outputs.component }}
      image_tag: ${{ needs.parse.outputs.version }}
    secrets: inherit
