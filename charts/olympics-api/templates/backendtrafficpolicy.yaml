{{- if and .Values.route.enabled .Values.route.rateLimit.enabled -}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "app.fullname" . }}
  rateLimit:
    type: Local
    local:
      rules:
        # per client ip, enforced per proxy replica
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: {{ .Values.route.rateLimit.requests }}
            unit: {{ .Values.route.rateLimit.unit }}
{{- end }}
