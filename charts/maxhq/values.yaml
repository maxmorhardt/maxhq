fullnameOverride: maxhq

image:
  repository: maxmorhardt/maxhq
  tag: ''
  pullPolicy: IfNotPresent
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  volumes:
    - name: tmp
      mountPath: /tmp
      volumeType: emptyDir
    - name: cache
      mountPath: /var/cache/nginx
      volumeType: emptyDir
    - name: run
      mountPath: /var/run
      volumeType: emptyDir
  startupProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  readinessProbe:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  livenessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  name: http

route:
  enabled: true
  gateway:
    name: maxhq
    namespace: envoy-gateway-system
  hostnames:
    - maxhq.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
  rateLimit:
    enabled: true
    requests: 100
    unit: Second

resources:
  limits:
    cpu: 50m
    memory: 64Mi
  requests:
    cpu: 50m
    memory: 64Mi

affinity:
  podAntiAffinity:
    enabled: true
    weight: 100
    topologyKey: kubernetes.io/hostname

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 80
  targetRAM: 80

pdb:
  enabled: true
  minAvailable: 1

metrics:
  image:
    name: nginx-exporter
    repository: nginx/nginx-prometheus-exporter
    tag: 1.5.3
    pullPolicy: IfNotPresent
    args:
      - '--nginx.scrape-uri=http://127.0.0.1:9000/metrics'
  resources:
    limits:
      cpu: 50m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 64Mi
  service:
    type: ClusterIP
    port: 9113
    targetPort: 9113
    name: metrics
  serviceMonitor:
    enabled: true
    interval: 60s
    scrapeTimeout: 10s
    labels: {}
    honorLabels: true
  prometheusRule:
    enabled: true
    labels: {}
    rules:
      # Nginx Specific Alerts
      - alert: NginxDown
        expr: |
          up{job="{{ include "app.fullname" . }}"} == 0
        for: 5m
        labels:
          severity: critical
          component: maxhq
          layer: frontend
        annotations:
          summary: 'Nginx is down'
          description: 'Nginx metrics endpoint is not reachable for {{ $labels.job }}'

      - alert: HighNginxConnectionsActive
        expr: |
          nginx_connections_active{job="{{ include "app.fullname" . }}"} > 100
        for: 5m
        labels:
          severity: warning
          component: maxhq
          layer: frontend
        annotations:
          summary: 'High number of active connections'
          description: 'Nginx has {{ $value }} active connections'
