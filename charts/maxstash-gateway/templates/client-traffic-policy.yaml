apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "app.fullname" . }}
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        {{- toYaml .Values.trustedCIDRs | nindent 8 }}
