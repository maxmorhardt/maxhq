apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-apex
      port: 443
      protocol: HTTPS
      hostname: {{ .Values.domain }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: All
    - name: https-wildcard
      port: 443
      protocol: HTTPS
      hostname: '*.{{ .Values.domain }}'
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: All
