{{- if .Values.networkPolicy.enabled }}
# the service trusts the gateway's X-Auth-* headers, so app traffic may only arrive through the gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.route.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
    {{- end }}
    {{- if .Values.metrics.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - port: {{ .Values.metrics.service.targetPort }}
          protocol: TCP
    {{- end }}
    {{- range .Values.networkPolicy.internalCallers }}
    # {{ . }} calls this service's /internal routes directly
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
      ports:
        - port: {{ $.Values.service.targetPort }}
          protocol: TCP
    {{- end }}
{{- end }}
