fullnameOverride: squares-games
partOf: squares

image:
  repository: maxmorhardt/squares-games
  tag: ''
  pullPolicy: IfNotPresent
  revisionHistoryLimit: 2
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  volumes:
    - name: tmp
      mountPath: /tmp
      volumeType: emptyDir
    - name: home
      mountPath: /home/squares
      volumeType: emptyDir
    - name: log
      mountPath: /var/log
      volumeType: emptyDir
  startupProbe:
    path: /health/live
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  readinessProbe:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  livenessProbe:
    path: /health/live
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
    successThreshold: 1

secretName: ''

env:
  SCORES_ENABLED: 'true'

resources:
  limits:
    cpu: 250m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 128Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPU: 80
  targetRAM: 85

pdb:
  minAvailable: 1

strategy:
  maxSurge: 1
  maxUnavailable: 0

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  name: http

route:
  enabled: true
  gateway:
    name: maxhq
    namespace: envoy-gateway-system
  hostnames:
    - api.maxhq.io
  prefix: /squares
  paths:
    prefixes:
      - /games
    exact: []
  swaggerName: games
  rateLimit:
    enabled: true
    requests: 100
    unit: Second

auth:
  enabled: true
  issuer: https://login.maxhq.io
  jwksURI: https://login.maxhq.io/keys
  audiences:
    - squares
    - squares-mobile
  optional: true
  claimToHeaders:
    - header: X-Auth-Email
      claim: email
    - header: X-Auth-Name
      claim: name
    - header: X-Auth-Email-Verified
      claim: email_verified
    - header: X-Auth-Iat
      claim: iat
    - header: X-Auth-Exp
      claim: exp

networkPolicy:
  enabled: true
  gatewayNamespace: envoy-gateway-system
  monitoringNamespace: monitoring
  internalCallers: []

affinity:
  podAntiAffinity:
    enabled: true
    weight: 100
    topologyKey: kubernetes.io/hostname

metrics:
  enabled: true
  service:
    port: 9090
    targetPort: 9090
    type: ClusterIP
    name: metrics
  path: /metrics
  serviceMonitor:
    enabled: true
    interval: 60s
    scrapeTimeout: 10s
    labels: {}
    honorLabels: true
  prometheusRule:
    enabled: true
    labels: {}
    rules:
      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="{{ include "app.fullname" . }}"}[5m])) by (le, method, path)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High request latency detected'
          description: 'P99 latency is {{ $value }}s for {{ $labels.method }} {{ $labels.path }}'

      - alert: CriticalRequestLatency
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="{{ include "app.fullname" . }}"}[5m])) by (le, method, path)) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Critical request latency detected'
          description: 'P99 latency is {{ $value }}s for {{ $labels.method }} {{ $labels.path }}'

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="{{ include "app.fullname" . }}",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High HTTP error rate'
          description: 'Error rate is {{ $value | humanizePercentage }}'

      - alert: CriticalErrorRate
        expr: |
          sum(rate(http_requests_total{job="{{ include "app.fullname" . }}",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m])) > 0.10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Critical HTTP error rate'
          description: 'Error rate is {{ $value | humanizePercentage }}'

      - alert: High4xxRate
        expr: |
          sum(rate(http_requests_total{job="{{ include "app.fullname" . }}",status=~"4.."}[5m])) / sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m])) > 0.20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'High client error rate'
          description: '4xx error rate is {{ $value | humanizePercentage }}'

      - alert: Critical4xxRate
        expr: |
          sum(rate(http_requests_total{job="{{ include "app.fullname" . }}",status=~"4.."}[5m])) / sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m])) > 0.50
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Critical client error rate'
          description: '4xx error rate is {{ $value | humanizePercentage }}'

      - alert: OutboxBacklog
        expr: |
          max(outbox_oldest_pending_seconds{job="{{ include "app.fullname" . }}"}) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Events are not reaching redis'
          description: 'The oldest unrelayed outbox event is {{ $value }}s old; other services and live viewers are not seeing its changes'

      - alert: ScoresWorkerFailing
        expr: |
          increase(scores_worker_runs_total{job="{{ include "app.fullname" . }}",result="error"}[1h]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Scores worker runs are failing'
          description: '{{ $value }} scores worker runs failed in the last hour; the ESPN scoreboard response may have changed'

      # threshold clears the 6h idle poll interval; the > 0 guard keeps a never-yet-run worker quiet
      - alert: ScoresWorkerStale
        expr: |
          (time() - max(scores_worker_last_success_timestamp_seconds{job="{{ include "app.fullname" . }}"}) > 25200) and (max(scores_worker_last_success_timestamp_seconds{job="{{ include "app.fullname" . }}"}) > 0)
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: 'Scores worker has not succeeded recently'
          description: 'Last successful scores worker run was {{ $value }}s ago; live contests are not being scored'

