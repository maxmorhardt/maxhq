{{- if .Values.route.enabled }}
{{- $prefix := .Values.route.prefix }}
{{- $backend := include "app.fullname" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $backend }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
  hostnames:
    {{- range .Values.route.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    {{- range .Values.route.paths.prefixes }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ printf "%s%s" $prefix . }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ . }}
      {{- if $.Values.route.streaming }}
      timeouts:
        request: 0s
      {{- end }}
      backendRefs:
        - name: {{ $backend }}
          port: {{ $.Values.service.port }}
    {{- end }}
    {{- range .Values.route.paths.exact }}
    - matches:
        - path:
            type: Exact
            value: {{ printf "%s%s" $prefix . }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ . }}
      backendRefs:
        - name: {{ $backend }}
          port: {{ $.Values.service.port }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ printf "%s/swagger/%s" $prefix .Values.route.swaggerName }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /swagger
      backendRefs:
        - name: {{ $backend }}
          port: {{ .Values.service.port }}
{{- end }}
