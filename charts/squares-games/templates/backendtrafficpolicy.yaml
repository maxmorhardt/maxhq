{{- if and .Values.route.enabled .Values.route.rateLimit.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "app.fullname" . }}
  rateLimit:
    type: Local
    local:
      rules:
        {{- $rules := prepend (.Values.route.rateLimit.rules | default list) (dict "requests" .Values.route.rateLimit.requests "unit" .Values.route.rateLimit.unit) }}
        {{- range $rule := $rules }}
        {{- range $cidr := list "0.0.0.0/0" "::/0" }}
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: {{ $cidr }}
              {{- if $rule.path }}
              path:
                type: Exact
                value: {{ printf "%s%s" $.Values.route.prefix $rule.path }}
              {{- end }}
              {{- with $rule.methods }}
              methods:
                {{- range . }}
                - value: {{ . }}
                {{- end }}
              {{- end }}
          limit:
            requests: {{ $rule.requests }}
            unit: {{ $rule.unit }}
        {{- end }}
        {{- end }}
{{- end }}
