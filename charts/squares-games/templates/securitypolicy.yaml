{{- if and .Values.route.enabled .Values.auth.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "app.fullname" . }}
  jwt:
    optional: {{ .Values.auth.optional }}
    providers:
      - name: dex
        issuer: {{ .Values.auth.issuer | quote }}
        audiences:
          {{- toYaml .Values.auth.audiences | nindent 10 }}
        remoteJWKS:
          uri: {{ .Values.auth.jwksURI | quote }}
        claimToHeaders:
          {{- toYaml .Values.auth.claimToHeaders | nindent 10 }}
{{- end }}
