apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.image.revisionHistoryLimit }}
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.hpa.minReplicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.image.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.image.securityContext.runAsUser }}
        fsGroup: {{ .Values.image.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.affinity.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.affinity.podAntiAffinity.weight }}
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "app.selectorLabels" . | nindent 20 }}
                topologyKey: {{ .Values.affinity.podAntiAffinity.topologyKey }}
      {{- end }}
      containers:
        - name: {{ include "app.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ include "app.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.image.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.image.securityContext.readOnlyRootFilesystem }}
            runAsNonRoot: {{ .Values.image.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.image.securityContext.runAsUser }}
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: {{ .Values.secretName | default (printf "%s-env" (include "app.fullname" .)) }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.service.targetPort | quote }}
            # the go runtime collects harder as it nears the container limit instead of being oom-killed
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: {{ .Values.service.name }}
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: {{ .Values.metrics.service.name }}
              containerPort: {{ .Values.metrics.service.targetPort }}
              protocol: TCP
            {{- end }}
          {{- if .Values.image.volumes }}
          volumeMounts:
            {{- range .Values.image.volumes }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- range $probe := list "startupProbe" "readinessProbe" "livenessProbe" }}
          {{- with index $.Values.image $probe }}
          {{ $probe }}:
            httpGet:
              port: {{ $.Values.service.targetPort }}
              path: {{ .path }}
              scheme: HTTP
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
            {{- with .successThreshold }}
            successThreshold: {{ . }}
            {{- end }}
          {{- end }}
          {{- end }}
      {{- if .Values.image.volumes }}
      volumes:
        {{- range .Values.image.volumes }}
        - name: {{ .name }}
          {{- if eq .volumeType "emptyDir" }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- end }}
