fullnameOverride: squares-api

image:
  repository: maxmorhardt/squares-api
  tag: latest
  pullPolicy: Always
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  volumes:
    - name: tmp
      mountPath: /tmp
      volumeType: emptyDir
    - name: home
      mountPath: /home/squares
      volumeType: emptyDir
    - name: log
      mountPath: /var/log
      volumeType: emptyDir
  envFrom:
    - secretRef:
        name: squares-api-env
  startupProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  readinessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 5
    successThreshold: 1
  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 5
    successThreshold: 1

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  name: http

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '1m'
    nginx.ingress.kubernetes.io/client-body-buffer-size: '1m'
    nginx.ingress.kubernetes.io/limit-rps: '50'
    nginx.ingress.kubernetes.io/limit-burst-multiplier: '5'
  hosts:
    - host: squares-api.maxstash.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: maxstash.io-tls
      hosts:
        - squares-api.maxstash.io

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 1Gi

affinity:
  podAntiAffinity:
    enabled: true
    weight: 100
    topologyKey: kubernetes.io/hostname

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPU: 85
  targetRAM: 85

pdb:
  enabled: true
  minAvailable: 1

metrics:
  enabled: true
  service:
    port: 9090
    targetPort: 9090
    type: ClusterIP
    name: metrics
  path: /metrics
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    honorLabels: true
  prometheusRule:
    enabled: true
    labels: {}
    rules:
      # High Request Latency
      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="{{ include "app.fullname" . }}"}[5m])) by (le, method, path)) > 1
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: 'High request latency detected'
          description: 'P99 latency is {{ $value }}s for {{ $labels.method }} {{ $labels.path }} on {{ $labels.job }}'

      - alert: CriticalRequestLatency
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="{{ include "app.fullname" . }}"}[5m])) by (le, method, path)) > 3
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: 'Critical request latency detected'
          description: 'P99 latency is {{ $value }}s for {{ $labels.method }} {{ $labels.path }} on {{ $labels.job }}'

      # High Error Rate
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="{{ include "app.fullname" . }}",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: 'High HTTP error rate'
          description: 'Error rate is {{ $value | humanizePercentage }} for {{ $labels.job }}'

      - alert: CriticalErrorRate
        expr: |
          sum(rate(http_requests_total{job="{{ include "app.fullname" . }}",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m])) > 0.10
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: 'Critical HTTP error rate'
          description: 'Error rate is {{ $value | humanizePercentage }} for {{ $labels.job }}'

      # CPU Throttling
      - alert: HighCPUThrottling
        expr: |
          rate(container_cpu_cfs_throttled_seconds_total{pod=~"{{ include "app.fullname" . }}-.*"}[5m]) > 0.25
        for: 15m
        labels:
          severity: warning
          component: api
        annotations:
          summary: 'High CPU throttling detected'
          description: 'Pod {{ $labels.pod }} is being throttled {{ $value | humanizePercentage }} of the time'

      - alert: SevereCPUThrottling
        expr: |
          rate(container_cpu_cfs_throttled_seconds_total{pod=~"{{ include "app.fullname" . }}-.*"}[5m]) > 0.50
        for: 10m
        labels:
          severity: critical
          component: api
        annotations:
          summary: 'Severe CPU throttling detected'
          description: 'Pod {{ $labels.pod }} is being throttled {{ $value | humanizePercentage }} of the time'

      # Memory Usage
      - alert: ApproachingMemoryLimit
        expr: |
          (container_memory_working_set_bytes{pod=~"{{ include "app.fullname" . }}-.*"} / container_spec_memory_limit_bytes{pod=~"{{ include "app.fullname" . }}-.*"}) > 0.85
        for: 10m
        labels:
          severity: warning
          component: api
        annotations:
          summary: 'Pod approaching memory limit'
          description: 'Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit'

      - alert: CriticalMemoryUsage
        expr: |
          (container_memory_working_set_bytes{pod=~"{{ include "app.fullname" . }}-.*"} / container_spec_memory_limit_bytes{pod=~"{{ include "app.fullname" . }}-.*"}) > 0.95
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: 'Pod critically close to memory limit'
          description: 'Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit'

      # Pod Restarts
      - alert: PodRestartingFrequently
        expr: |
          rate(kube_pod_container_status_restarts_total{pod=~"{{ include "app.fullname" . }}-.*"}[15m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: 'Pod restarting frequently'
          description: 'Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes'

      # Pod Not Ready
      - alert: PodNotReady
        expr: |
          kube_pod_status_phase{pod=~"{{ include "app.fullname" . }}-.*",phase!~"Running|Succeeded"} > 0
        for: 10m
        labels:
          severity: warning
          component: api
        annotations:
          summary: 'Pod not ready'
          description: 'Pod {{ $labels.pod }} has been in {{ $labels.phase }} state for more than 10 minutes'

      # Deployment Replica Mismatch
      - alert: DeploymentReplicaMismatch
        expr: |
          kube_deployment_spec_replicas{deployment="{{ include "app.fullname" . }}"} != kube_deployment_status_replicas_available{deployment="{{ include "app.fullname" . }}"}
        for: 15m
        labels:
          severity: warning
          component: api
        annotations:
          summary: 'Deployment replica mismatch'
          description: 'Deployment {{ $labels.deployment }} has {{ $value }} mismatched replicas'

      # HPA Approaching Max Replicas
      - alert: HPAApproachingMaxReplicas
        expr: |
          kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler="{{ include "app.fullname" . }}"} / kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler="{{ include "app.fullname" . }}"} > 0.9
        for: 15m
        labels:
          severity: warning
          component: api
        annotations:
          summary: 'HPA approaching max replicas'
          description: 'HPA {{ $labels.horizontalpodautoscaler }} is at {{ $value | humanizePercentage }} of max replicas'

      # Request Rate Anomaly
      - alert: RequestRateDrop
        expr: |
          (sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m])) / sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m] offset 1h))) < 0.2
        for: 10m
        labels:
          severity: warning
          component: api
        annotations:
          summary: 'Significant drop in request rate'
          description: 'Request rate has dropped to {{ $value | humanizePercentage }} of normal for {{ $labels.job }}'

      # High 4xx Rate
      - alert: High4xxRate
        expr: |
          sum(rate(http_requests_total{job="{{ include "app.fullname" . }}",status=~"4.."}[5m])) / sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m])) > 0.20
        for: 10m
        labels:
          severity: warning
          component: api
        annotations:
          summary: 'High client error rate'
          description: '4xx error rate is {{ $value | humanizePercentage }} for {{ $labels.job }}'

      - alert: Critical4xxRate
        expr: |
          sum(rate(http_requests_total{job="{{ include "app.fullname" . }}",status=~"4.."}[5m])) / sum(rate(http_requests_total{job="{{ include "app.fullname" . }}"}[5m])) > 0.50
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: 'Critical client error rate'
          description: '4xx error rate is {{ $value | humanizePercentage }} for {{ $labels.job }}'
