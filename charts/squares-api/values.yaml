fullnameOverride: squares-api

image:
  repository: maxmorhardt/squares-api
  tag: latest
  pullPolicy: Always
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  volumes:
    - name: tmp
      mountPath: /tmp
      volumeType: emptyDir
    - name: home
      mountPath: /home/squares
      volumeType: emptyDir
    - name: log
      mountPath: /var/log
      volumeType: emptyDir
  envFrom:
    - secretRef:
        name: squares-api-env
  startupProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  readinessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 5
    successThreshold: 1
  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 5
    successThreshold: 1

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  name: http

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '1m'
    nginx.ingress.kubernetes.io/client-body-buffer-size: '1m'
    nginx.ingress.kubernetes.io/limit-rps: '50'
    nginx.ingress.kubernetes.io/limit-burst-multiplier: '5'
  hosts:
    - host: squares-api.maxstash.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: maxstash.io-tls
      hosts:
        - squares-api.maxstash.io

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 1Gi

affinity:
  podAntiAffinity:
    enabled: true
    weight: 100
    topologyKey: kubernetes.io/hostname

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPU: 85
  targetRAM: 85

pdb:
  enabled: true
  minAvailable: 1

metrics:
  enabled: true
  service:
    type: ClusterIP
    port: 2112
    targetPort: 2112
    name: metrics
