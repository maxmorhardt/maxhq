apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "app.fullname" . }}
  namespace: envoy-gateway-system
  labels:
    {{- include "app.labels" . | nindent 4 }}
rules:
  - apiGroups: ['gateway.envoyproxy.io']
    resources: ['clienttrafficpolicies']
    verbs: ['get', 'patch']