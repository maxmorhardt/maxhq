fullnameOverride: cloudflare-cidr

schedule: '0 0 * * *'

existingSecret: cloudflare-cidr-env

image:
  repository: python
  pullPolicy: IfNotPresent
  tag: ''
  command:
    - python3
    - /scripts/cloudflare-cidr.py

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 32Mi

restartPolicy: Never
backoffLimit: 0
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 1
failedJobsHistoryLimit: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
