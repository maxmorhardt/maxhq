{{- if .Values.cachePurge.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.fullname" . }}-cache-purge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.cachePurge.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.cachePurge.activeDeadlineSeconds }}
  template:
    metadata:
      # not the app's selector labels, or its Service would route to and scrape this pod
      labels:
        app.kubernetes.io/name: {{ include "app.fullname" . }}-cache-purge
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cache-purge
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.cachePurge.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cache-purge
          image: "{{ .Values.cachePurge.image.repository }}:{{ .Values.cachePurge.image.tag }}"
          imagePullPolicy: {{ .Values.cachePurge.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: {{ .Values.cachePurge.existingSecret }}
          env:
            - name: PURGE_BODY
              value: {{ dict "hosts" .Values.route.hostnames | toJson | quote }}
          command:
            - sh
            - -c
            - >-
              curl -fsS --retry 3 -X POST
              "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache"
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
              -H "Content-Type: application/json"
              --data "$PURGE_BODY"
          resources:
            {{- toYaml .Values.cachePurge.resources | nindent 12 }}
{{- end }}
