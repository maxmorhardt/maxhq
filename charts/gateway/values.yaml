fullnameOverride: maxhq

domain: maxhq.io

gatewayClassName: maxhq

tls:
  secretName: maxhq.io-tls

strippedRequestHeaders:
  - X-Auth-Email
  - X-Auth-Name
  - X-Auth-Email-Verified
  - X-Auth-Iat
  - X-Auth-Exp
  - X-Internal-Token

proxy:
  replicas: 2
  minAvailable: 1
  service:
    name: envoy-maxhq
    type: LoadBalancer
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# cloudflared dials out to Cloudflare, so the proxy needs no public port; routing lives in infra/terraform/cloudflare
tunnel:
  enabled: false
  replicas: 2
  minAvailable: 1
  # prod's network drops QUIC (udp 7844), and auto only falls back after the startup probe gives up
  protocol: http2
  image:
    repository: cloudflare/cloudflared
    # renovate: image=cloudflare/cloudflared
    tag: 2026.10.3
  tokenSecret:
    name: cloudflared-token
    key: token
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 128Mi

# cloudflared reaches the proxy from the pod network and passes Cloudflare's X-Forwarded-For through
trustedCIDRs:
  - 10.42.0.0/16
