fullnameOverride: maxhq

domain: maxhq.io

gatewayClassName: maxhq

tls:
  secretName: maxhq.io-tls

strippedRequestHeaders:
  - X-Auth-Email
  - X-Auth-Name
  - X-Auth-Email-Verified
  - X-Auth-Iat
  - X-Auth-Exp
  - X-Internal-Token

proxy:
  replicas: 2
  # keeps one proxy serving while a node drains
  minAvailable: 1
  service:
    name: envoy-maxhq
    type: LoadBalancer
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

