apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "app.fullname" . }}
  {{- if .Values.originPulls.enabled }}
  tls:
    clientValidation:
      caCertificateRefs:
        - group: ''
          kind: ConfigMap
          name: {{ include "app.fullname" . }}-origin-pull-ca
  {{- end }}
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        {{- toYaml .Values.trustedCIDRs | nindent 8 }}
  {{- with .Values.strippedRequestHeaders }}
  headers:
    earlyRequestHeaders:
      remove:
        {{- toYaml . | nindent 8 }}
  {{- end }}
