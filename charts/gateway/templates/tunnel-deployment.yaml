{{- if .Values.tunnel.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}-tunnel
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: tunnel
spec:
  replicas: {{ .Values.tunnel.replicas }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tunnel
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tunnel
      annotations:
        checksum/origin-ca: {{ include (print $.Template.BasePath "/tunnel-origin-ca.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "app.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: tunnel
      containers:
        - name: cloudflared
          image: "{{ .Values.tunnel.image.repository }}:{{ .Values.tunnel.image.tag }}"
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - --protocol
            - {{ .Values.tunnel.protocol }}
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tunnel.tokenSecret.name }}
                  key: {{ .Values.tunnel.tokenSecret.key }}
          ports:
            - name: metrics
              containerPort: 2000
          # /ready answers 200 only while the replica holds a connection to Cloudflare
          startupProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.tunnel.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: origin-ca
              mountPath: /etc/cloudflared/origin-ca
              readOnly: true
      volumes:
        - name: origin-ca
          configMap:
            name: {{ include "app.fullname" . }}-tunnel-origin-ca
{{- end }}
